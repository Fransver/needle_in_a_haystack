# Connection settings for the engine's test/dummy application.
#
# The database NAME is gem-specific (needle_in_a_haystack_* by default) so it
# never collides with another app's databases. Connection details use
# NIAH_-prefixed environment variables on purpose: generic names like DB_USER
# are often already exported in a developer's shell for another project, and
# dotenv does not override an existing variable. The NIAH_ prefix keeps this
# project isolated. Values are loaded from a gitignored .env (see .env.example)
# in development/test, or set directly in CI. No secret lives in version control.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("NIAH_DB_USER", "root") %>
  password: <%= ENV["NIAH_DB_PASSWORD"] %>
  host: <%= ENV.fetch("NIAH_DB_HOST", "127.0.0.1") %>
  <% if ENV["NIAH_DB_SOCKET"] %>socket: <%= ENV["NIAH_DB_SOCKET"] %><% end %>

development:
  <<: *default
  database: <%= ENV.fetch("NIAH_DATABASE", "needle_in_a_haystack") %>_development

test:
  <<: *default
  database: <%= ENV.fetch("NIAH_DATABASE", "needle_in_a_haystack") %>_test
