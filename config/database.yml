# Connection settings for the engine's test/dummy application.
#
# Defaults to a self-contained MySQL database named needle_in_a_haystack_*.
# Every value can be overridden through environment variables, so CI and local
# setups can point elsewhere without editing this file.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  <% if ENV["DB_SOCKET"] %>socket: <%= ENV["DB_SOCKET"] %><% end %>

development:
  <<: *default
  database: <%= ENV.fetch("NIAH_DATABASE", "needle_in_a_haystack") %>_development

test:
  <<: *default
  database: <%= ENV.fetch("NIAH_DATABASE", "needle_in_a_haystack") %>_test
