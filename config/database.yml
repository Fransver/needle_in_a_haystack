# Connection settings for the engine's test/dummy application.
#
# The database NAME is gem-specific (needle_in_a_haystack_*) so it never
# collides with another app's databases. Credentials come from environment
# variables (loaded from a gitignored .env via dotenv in development/test, or
# set directly in CI) so no secret lives in version control. See .env.example.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  <% if ENV["DB_SOCKET"] %>socket: <%= ENV["DB_SOCKET"] %><% end %>

development:
  <<: *default
  database: <%= ENV.fetch("NIAH_DATABASE", "needle_in_a_haystack") %>_development

test:
  <<: *default
  database: <%= ENV.fetch("NIAH_DATABASE", "needle_in_a_haystack") %>_test
